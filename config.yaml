# =====================================================================
#  JARVIS - Hauptkonfiguration
#
#  Eigene Anpassungen gehoeren in "config.local.yaml" (gleicher Ordner).
#  Diese Datei wird nicht committet und ueberschreibt Werte von hier:
#  Dictionaries werden zusammengefuehrt, Listen komplett ersetzt.
#
#  API-Keys gehoeren NICHT hierher -> .env oder Windows Credential Manager.
# =====================================================================

assistant:
  name: JARVIS
  user_name: ""            # Wie JARVIS dich nennt, z. B. "Nik"
  # Platzhalter: {name}, {user}, {date}
  system_prompt: |
    Du bist {name}, ein persönlicher KI-Assistent. Du läufst lokal auf dem Windows-11-PC von {user}.
    Antworte standardmäßig auf Deutsch – präzise, hilfsbereit und gern mit einer Prise trockenem Humor.
    Heute ist {date}.

    Aktueller Ausbaustand (Phase 1): Du kannst nur chatten. Du hast noch KEINE Werkzeuge. Du kannst
    keine Dateien lesen oder schreiben, keine Programme starten, nichts im Internet nachsehen und dir
    nichts über diese Sitzung hinaus merken. Wenn du um so etwas gebeten wirst, sag ehrlich, dass
    diese Fähigkeit noch nicht verfügbar ist, statt so zu tun, als hättest du es erledigt.
    Wenn du etwas nicht weißt oder unsicher bist, sag es.

paths:
  # "auto" = %LOCALAPPDATA%\Jarvis (Logs, Datenbank, Hardware-Report, Verlauf).
  # Absichtlich ausserhalb des Code-Ordners: Ab Phase 8 wechselt JARVIS fuer
  # Selbstverbesserungen Git-Branches - Daten duerfen davon nie betroffen sein.
  # Relative Pfade beziehen sich auf den Ordner dieser Datei.
  data_dir: auto

logging:
  file_level: INFO         # DEBUG | INFO | WARNING | ERROR
  console_level: WARNING   # im Chat nur Warnungen anzeigen
  max_bytes: 5000000       # Rotation ab 5 MB
  backup_count: 5

secrets:
  use_keyring: true        # Windows Credential Manager verwenden
  keyring_service: JARVIS

budget:
  # Harte Grenzen fuer Cloud-API-Kosten in US-Dollar (die Anbieter rechnen in USD ab).
  # Bei Erreichen blockiert der Router alle kostenpflichtigen Modelle.
  # 0 = keine Cloud-Kosten erlaubt (ab Phase 3 laufen dann nur lokale Modelle).
  daily_limit_usd: 2.00
  monthly_limit_usd: 30.00
  warn_at_ratio: 0.8       # Warnung ab 80 % eines Limits

conversation:
  # Kurzzeitgedaechtnis: so viel Verlauf wird pro Anfrage mitgeschickt.
  max_messages: 40
  max_chars: 100000

ui:
  show_usage_line: true    # nach jeder Antwort Modell, Tokens und Kosten zeigen
  save_input_history: true # Eingabeverlauf (Pfeiltasten) im Datenordner speichern

router:
  default_max_tokens: 16000
  # Zusaetzliche Python-Module mit eigenen Anbieter-Plugins (@register_provider)
  provider_modules: []

  providers:
    anthropic:
      enabled: true
      api_key_name: ANTHROPIC_API_KEY
      timeout_s: 300
      max_retries: 2        # automatische Wiederholung bei 429/5xx/Netzwerk (SDK)
      options:
        prompt_caching: true  # spart Kosten bei langen Chats (Verlauf wird gecacht)

  # Modellkatalog. Preise in USD pro 1 Mio. Tokens (Stand: Oktober 2026).
  # quality/speed (1-10) nutzt ab Phase 3 die automatische Modellwahl.
  models:
    - id: claude-opus-5-5
      provider: anthropic
      display_name: Claude Opus 5.5
      quality: 10
      speed: 6
      context_window: 1000000
      max_output_tokens: 128000
      input_cost_per_mtok: 4.00
      output_cost_per_mtok: 20.00
      cache_read_cost_per_mtok: 0.20
      refusal_fallback: true   # serverseitiger Fallback, falls ein Sicherheitsfilter ablehnt

    - id: claude-sonnet-5-5
      provider: anthropic
      display_name: Claude Sonnet 5.5
      quality: 8
      speed: 8
      context_window: 1000000
      max_output_tokens: 128000
      input_cost_per_mtok: 2.00
      output_cost_per_mtok: 10.00
      cache_read_cost_per_mtok: 0.20
      refusal_fallback: true

    - id: claude-haiku-5-5
      provider: anthropic
      display_name: Claude Haiku 5.5
      quality: 6
      speed: 10
      context_window: 1000000
      max_output_tokens: 128000
      input_cost_per_mtok: 0.10
      output_cost_per_mtok: 0.50
      long_context_threshold_tokens: 100000   # darueber gelten hoehere Preise
      long_input_cost_per_mtok: 0.50
      long_output_cost_per_mtok: 2.50

    # Wird nicht direkt verwendet, sondern dient als Preisreferenz, falls Anthropic
    # eine abgelehnte Anfrage serverseitig an dieses Modell weiterleitet.
    - id: claude-opus-4-8
      provider: anthropic
      display_name: Claude Opus 4.8
      enabled: false
      quality: 9
      speed: 6
      context_window: 1000000
      max_output_tokens: 128000
      input_cost_per_mtok: 5.00
      output_cost_per_mtok: 25.00

  # Routing: welches Modell fuer welche Art von Aufgabe. Die Liste ist eine
  # Fallback-Kette - faellt das erste Modell aus (Ueberlastung, Netzwerk, ...),
  # wird das naechste versucht. "effort" steuert, wie gruendlich das Modell
  # nachdenkt (low | medium | high | xhigh | max) und damit auch die Kosten.
  routes:
    chat:
      - {model: claude-opus-5-5, effort: low}
      - {model: claude-sonnet-5-5, effort: low}
      - {model: claude-haiku-5-5, effort: low}
    planning:
      - {model: claude-opus-5-5, effort: high, max_tokens: 64000}
      - {model: claude-sonnet-5-5, effort: high, max_tokens: 64000}
    code:
      - {model: claude-opus-5-5, effort: high, max_tokens: 64000}
      - {model: claude-sonnet-5-5, effort: high, max_tokens: 64000}
    review:
      - {model: claude-opus-5-5, effort: medium}
      - {model: claude-sonnet-5-5, effort: medium}
    simple:
      - {model: claude-haiku-5-5, effort: low}
      - {model: claude-sonnet-5-5, effort: low}
    summarize:
      - {model: claude-haiku-5-5, effort: low}
      - {model: claude-sonnet-5-5, effort: low}

hardware:
  # Empfehlungen fuer lokale Modelle (Ollama, ab Phase 3). Von oben nach unten
  # wird die erste Stufe gewaehlt, die deine Hardware erfuellt. Die Modell-Tags
  # kannst du jederzeit anpassen: https://ollama.com/library
  embedding_model: nomic-embed-text
  local_model_tiers:
    - name: gpu-24gb
      requires_gpu: true
      min_vram_gb: 22
      min_ram_gb: 16
      general: qwen3:32b
      coder: qwen3-coder:30b
      fast: qwen3:8b
      whisper_model: large-v3
      whisper_device: cuda
      whisper_compute_type: float16

    - name: gpu-16gb
      requires_gpu: true
      min_vram_gb: 14
      min_ram_gb: 16
      general: qwen3:14b
      coder: qwen2.5-coder:14b
      fast: qwen3:4b
      whisper_model: large-v3-turbo
      whisper_device: cuda
      whisper_compute_type: float16

    - name: gpu-12gb
      requires_gpu: true
      min_vram_gb: 10.5
      min_ram_gb: 8
      general: qwen3:14b
      coder: qwen2.5-coder:14b
      fast: qwen3:4b
      whisper_model: large-v3-turbo
      whisper_device: cuda
      whisper_compute_type: int8_float16

    - name: gpu-8gb
      requires_gpu: true
      min_vram_gb: 7
      min_ram_gb: 8
      general: qwen3:8b
      coder: qwen2.5-coder:7b
      fast: qwen3:4b
      whisper_model: small
      whisper_device: cuda
      whisper_compute_type: int8_float16

    - name: gpu-6gb
      requires_gpu: true
      min_vram_gb: 5
      min_ram_gb: 8
      general: qwen3:4b
      coder: qwen2.5-coder:3b
      fast: qwen3:1.7b
      whisper_model: small
      whisper_device: cuda
      whisper_compute_type: int8

    - name: cpu-32gb
      min_ram_gb: 30
      general: qwen3:8b
      coder: qwen2.5-coder:7b
      fast: qwen3:1.7b
      whisper_model: small
      whisper_device: cpu
      whisper_compute_type: int8

    - name: cpu-16gb
      min_ram_gb: 14
      general: qwen3:4b
      coder: qwen2.5-coder:3b
      fast: qwen3:1.7b
      whisper_model: base
      whisper_device: cpu
      whisper_compute_type: int8

    - name: minimal
      min_ram_gb: 0
      general: qwen3:1.7b
      coder: qwen2.5-coder:1.5b
      fast: qwen3:0.6b
      whisper_model: base
      whisper_device: cpu
      whisper_compute_type: int8
